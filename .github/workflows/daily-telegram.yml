name: Daily Telegram Heartbeat

on:
  schedule:
    # 9:00 AM IST = 3:30 AM UTC, every day
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check RestoPulse health
        id: health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://restopulse.onrender.com/health)
          echo "status=$STATUS" >> $GITHUB_OUTPUT

      - name: Send Telegram heartbeat
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ steps.health.outputs.status }}"
          if [ "$STATUS" = "200" ]; then
            ICON="✅"
            LABEL="Alive"
          else
            ICON="🚨"
            LABEL="DOWN (HTTP $STATUS)"
          fi
          DATE=$(TZ=Asia/Kolkata date '+%d %b %Y, %I:%M %p IST')
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${CHAT_ID}\",\"text\":\"${ICON} <b>RestoPulse Morning Check</b>\\n📅 ${DATE}\\n\\nRender: <b>${LABEL}</b>\\n🌐 restopulse.onrender.com\",\"parse_mode\":\"HTML\"}"
