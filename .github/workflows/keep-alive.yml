name: Keep Render Alive

on:
  schedule:
    # Every 14 min, Mon-Fri, 10am-8pm IST (4:30am-2:30pm UTC)
    - cron: '*/14 4-14 * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RestoPulse
        run: curl -f https://restopulse.onrender.com/health
