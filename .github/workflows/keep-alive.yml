name: Keep Render Alive

on:
  schedule:
    # Every 14 min, Mon-Fri, 10am-6pm IST (4:30am-12:30pm UTC)
    - cron: '*/14 4-12 * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping RestoPulse
        run: curl -f https://restopulse.onrender.com/health
      - name: Ping Earnings Lens
        run: curl -f https://earningslens-vh6j.onrender.com/health
      - name: Ping NEWS AI
        run: curl -f https://daily-bytes-ai.onrender.com/health
