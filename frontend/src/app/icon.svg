<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="#0d0d1a"/>

  <!-- Fork tines -->
  <line x1="9" y1="4" x2="9" y2="11" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="11.5" y1="4" x2="11.5" y2="11" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="14" y1="4" x2="14" y2="11" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Fork neck -->
  <path d="M9 11 Q11.5 14 11.5 15 L11.5 28" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M14 11 Q11.5 14 11.5 15" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Pulse line -->
